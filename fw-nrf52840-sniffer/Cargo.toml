[package]
name = "fw-nrf52840-sniffer"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "time-driver-rtc1"] }
embassy-time = "0.5.1"
embassy-usb = { version = "0.6.0", default-features = false }
panic-halt = "1.0.0"
static_cell = "2.1.1"
