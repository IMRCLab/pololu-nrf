[package]
name = "pololu3pi2040-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m-rt = "0.7.7"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10.0", features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-time = "0.5.1"
embassy-usb = { version = "0.6.0", default-features = false }
embedded-fatfs = { package = "deluge-embedded-fatfs", version = "0.2.1", default-features = false, features = ["lfn"] }
embedded-io-async = "0.7.0"
panic-halt = "1"
# Cortex-M0+ has no atomic CAS: static_cell needs the critical-section fallback
portable-atomic = { version = "1", features = ["critical-section"] }
static_cell = "2.1.1"
# USB mass storage class: trimmed and patched copy, see vendor/deluge-usb-classes/PATCHES.md
usb-classes = { package = "deluge-usb-classes", path = "vendor/deluge-usb-classes" }
