[package]
name = "pololu3pi2040-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m-rt = "0.7.7"
display-interface = "0.5.0"
display-interface-spi = "0.5.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10.0", features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-time = "0.5.1"
embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
embedded-hal-bus = { version = "0.3", features = ["async"] }
oled_async = { version = "0.2.1", features = ["graphics", "spi"] }
panic-halt = "1"
